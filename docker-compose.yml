# Local Postgres for development. Production uses Railway's Postgres;
# locally one direct connection is fine for both URLs. Port 5439: 5433 is
# Platform Pixels' and 5438 the old Go compose's at the repo root. Named,
# because Docker would otherwise take this for Platform Pixels' (also in a
# web/ folder), and not plain "schierco", which is the root compose's.
name: schierco-web
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schierco
      POSTGRES_PASSWORD: schierco
      POSTGRES_DB: schierco
    ports:
      - '5439:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
